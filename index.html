<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#FBF3E8" />
  <title>好好吃饭 · 食堂减脂助手</title>
  <style>
/* ================= 好好吃饭 · 温暖手账风格 ================= */

:root {
  --bg: #FBF3E8;
  --bg-soft: #FFF9F0;
  --card: #FFFEFB;
  --ink: #46382A;
  --ink-soft: #8A7660;
  --ink-faint: #B7A58D;
  --orange: #EF8A3C;
  --orange-deep: #DD7024;
  --orange-soft: #FBE3CE;
  --cream: #FFE9D0;
  --green: #6F9A5B;
  --green-soft: #E4EED9;
  --red: #DF6A58;
  --red-soft: #FBE3DE;
  --gold: #F2B84B;
  --line: #F0E4D3;

  --meal-breakfast: #E8A33D;
  --meal-lunch: #EF8A3C;
  --meal-dinner: #7C6BB0;
  --meal-snack: #D97C7C;

  --radius: 22px;
  --radius-sm: 14px;
  --shadow: 0 8px 24px rgba(180, 130, 70, .10);
  --shadow-sm: 0 3px 10px rgba(180, 130, 70, .08);

  --font-display: "STZhongsong", "Songti SC", "Noto Serif SC", Georgia, "SimSun", serif;
  --font-body: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Segoe UI", sans-serif;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

html, body { margin: 0; padding: 0; }

body {
  font-family: var(--font-body);
  background: var(--bg);
  color: var(--ink);
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

.grain {
  position: fixed; inset: 0; pointer-events: none; z-index: 0; opacity: .5;
  background-image:
    radial-gradient(circle at 20% 30%, rgba(255,255,255,.35) 0, transparent 40%),
    radial-gradient(circle at 80% 70%, rgba(239,138,60,.05) 0, transparent 45%);
}

.app {
  position: relative; z-index: 1; max-width: 480px; margin: 0 auto;
  padding-bottom: calc(84px + env(safe-area-inset-bottom)); min-height: 100vh;
}

/* ---------- 顶部 ---------- */
.topbar {
  display: flex; align-items: center; justify-content: space-between;
  padding: calc(20px + env(safe-area-inset-top)) 22px 8px;
}
.greet-title {
  font-family: var(--font-display); font-size: 30px; font-weight: 700;
  margin: 0; letter-spacing: .02em; color: var(--ink);
}
.greet-sub { margin: 4px 0 0; font-size: 13.5px; color: var(--ink-soft); }
.mascot {
  font-size: 34px; background: var(--cream); border-radius: 50%;
  width: 54px; height: 54px; display: grid; place-items: center;
  box-shadow: var(--shadow-sm); animation: bob 4s ease-in-out infinite;
}
@keyframes bob {
  0%, 100% { transform: translateY(0) rotate(-4deg); }
  50% { transform: translateY(-4px) rotate(4deg); }
}

/* ---------- 面板 ---------- */
.main { padding: 4px 18px 0; }
.panel { display: none; }
.panel.is-active { display: block; animation: rise .45s cubic-bezier(.22,.9,.3,1.2) both; }
@keyframes rise {
  from { opacity: 0; transform: translateY(14px); }
  to { opacity: 1; transform: translateY(0); }
}

/* ---------- 卡片通用 ---------- */
.card {
  background: var(--card); border: 1px solid var(--line);
  border-radius: var(--radius); box-shadow: var(--shadow); padding: 18px;
}
.card-title { font-family: var(--font-display); font-size: 19px; margin: 0; }
.card-sub { font-size: 12.5px; color: var(--ink-soft); margin: 5px 0 14px; }

/* ---------- 今日概览 ---------- */
.overview {
  display: flex; flex-direction: column; gap: 14px;
  background: linear-gradient(150deg, #FFF9F0 0%, #FFF1DF 100%);
}
.date-nav { display: flex; align-items: center; justify-content: center; gap: 14px; }
.date-nav button {
  border: none; background: var(--cream); color: var(--ink-soft);
  width: 32px; height: 32px; border-radius: 50%; cursor: pointer;
  font-size: 18px; line-height: 1; transition: all .15s ease;
}
.date-nav button:active { background: var(--orange-soft); }
.date-nav button:disabled { opacity: .28; }
.date-label { font-weight: 700; font-size: 14px; min-width: 76px; text-align: center; }

.ov-body { display: flex; align-items: center; gap: 18px; }
.ov-ring-wrap { position: relative; width: 116px; height: 116px; flex-shrink: 0; }
.ov-ring { width: 116px; height: 116px; transform: rotate(-90deg); }
.ring-bg, .ring-fg { fill: none; stroke-width: 10; stroke-linecap: round; }
.ring-bg { stroke: #F2E3CE; }
.ring-fg { stroke: var(--orange); stroke-dasharray: 326.7; stroke-dashoffset: 0; transition: stroke-dashoffset .8s cubic-bezier(.22,.9,.3,1.2); }
.ov-ring-center {
  position: absolute; inset: 0;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
}
.ov-remaining-num { font-family: var(--font-display); font-size: 26px; font-weight: 700; line-height: 1; }
.ov-remaining-label { font-size: 10px; color: var(--ink-soft); margin-top: 4px; }

.ov-stats { flex: 1; display: flex; flex-direction: column; gap: 7px; }
.ov-line { display: flex; justify-content: space-between; align-items: baseline; font-size: 13px; }
.ov-line span { color: var(--ink-soft); }
.ov-line b { font-size: 14px; font-weight: 700; color: var(--ink); }
.ov-hint { font-size: 11px; color: var(--ink-faint); margin-top: 2px; }

/* ---------- 当天吃了啥 ---------- */
.day-log { margin-top: 14px; }
.day-log-title { font-family: var(--font-display); font-size: 16px; margin: 0 0 12px; }
.log-group { margin-bottom: 12px; }
.log-group:last-child { margin-bottom: 0; }
.log-meal { font-size: 12px; font-weight: 700; color: var(--ink-soft); margin-bottom: 6px; }
.log-item { display: flex; align-items: center; gap: 8px; padding: 5px 0; font-size: 13px; }
.log-dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
.log-names { flex: 1; font-weight: 600; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.log-meta { color: var(--ink-faint); font-size: 12px; white-space: nowrap; }
.log-del { border: none; background: transparent; color: var(--ink-faint); font-size: 18px; cursor: pointer; padding: 0 4px; line-height: 1; }
.log-del:active { color: var(--red); }

/* ---------- 餐次切换 ---------- */
.meal-tabs { display: flex; gap: 6px; margin: 16px 0 12px; }
.meal-tab {
  flex: 1; border: 1px solid var(--line); background: var(--card); color: var(--ink-soft);
  font-size: 13px; font-weight: 600; padding: 11px 0; border-radius: 999px; cursor: pointer;
  transition: all .25s ease;
}
.meal-tab.is-active { color: #fff; }
.meal-tab[data-meal="breakfast"].is-active { background: var(--meal-breakfast); border-color: var(--meal-breakfast); box-shadow: 0 6px 16px rgba(232,163,61,.32); }
.meal-tab[data-meal="lunch"].is-active { background: var(--meal-lunch); border-color: var(--meal-lunch); box-shadow: 0 6px 16px rgba(239,138,60,.32); }
.meal-tab[data-meal="dinner"].is-active { background: var(--meal-dinner); border-color: var(--meal-dinner); box-shadow: 0 6px 16px rgba(124,107,176,.32); }
.meal-tab[data-meal="snack"].is-active { background: var(--meal-snack); border-color: var(--meal-snack); box-shadow: 0 6px 16px rgba(217,124,124,.32); }

/* ---------- 本餐目标 ---------- */
.meal-target {
  text-align: center; font-size: 12.5px; color: var(--ink-soft);
  background: var(--orange-soft); border-radius: 999px; padding: 9px 14px; margin-bottom: 14px;
}
.meal-target b { color: var(--orange-deep); }

/* ---------- 推荐列表 ---------- */
.rec-list { display: flex; flex-direction: column; gap: 12px; }
.rec-card {
  background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
  box-shadow: var(--shadow-sm); padding: 12px; display: flex; align-items: center; gap: 12px;
  animation: rise .5s cubic-bezier(.22,.9,.3,1.2) both;
}
.rec-img {
  width: 76px; height: 76px; border-radius: var(--radius-sm);
  background: var(--cream); overflow: hidden; flex-shrink: 0;
  display: grid; place-items: center; font-size: 30px;
}
.rec-img img { width: 100%; height: 100%; object-fit: cover; }
.rec-body { flex: 1; min-width: 0; }
.rec-title { font-weight: 700; font-size: 15px; margin-bottom: 7px; }
.rec-title.combo-title { font-size: 14px; font-weight: 600; line-height: 1.5; }
.rec-tags { display: flex; flex-wrap: wrap; gap: 5px; }
.tag { font-size: 11px; padding: 3px 8px; border-radius: 999px; font-weight: 600; white-space: nowrap; }
.tag.kcal { background: var(--orange-soft); color: var(--orange-deep); }
.tag.protein { background: var(--green-soft); color: var(--green); }
.tag.protein.missing { background: #F0ECE4; color: #A99B88; }
.tag.fat { background: #FBE9E0; color: #C07850; }
.tag.carb { background: #E6EEF6; color: #5C7EA6; }
.tag.veg { background: var(--green-soft); color: var(--green); }
.tag.price { background: #F6EEDC; color: #A8823E; }
.tag.badge { background: var(--red-soft); color: var(--red); }
.tag.chip { background: #F1EADF; color: var(--ink-soft); font-weight: 500; }
.rec-score {
  margin-top: 8px; font-size: 11px; color: var(--ink-faint);
  display: flex; align-items: center; gap: 5px;
}
.rec-score .bar { flex: 1; height: 5px; background: #F0E4D3; border-radius: 999px; overflow: hidden; max-width: 90px; }
.rec-score .bar i { display: block; height: 100%; background: linear-gradient(90deg, var(--gold), var(--orange)); border-radius: 999px; }

.eat-btn {
  flex-shrink: 0; border: none; background: var(--orange); color: #fff;
  font-size: 12.5px; font-weight: 700; padding: 9px 13px; border-radius: 999px; cursor: pointer;
  box-shadow: 0 4px 12px rgba(239,138,60,.3);
  transition: transform .15s ease, background .2s ease;
}
.eat-btn:active { transform: scale(.94); background: var(--orange-deep); }

.reshuffle {
  display: block; margin: 16px auto 4px;
  border: 1px solid var(--line); background: var(--card); color: var(--ink-soft);
  font-size: 13.5px; font-weight: 600; padding: 11px 28px; border-radius: 999px; cursor: pointer;
  transition: all .2s ease;
}
.reshuffle:active { background: var(--cream); transform: scale(.97); }

.rec-empty { text-align: center; padding: 30px 10px; }
.rec-empty .empty-emoji { font-size: 44px; margin-bottom: 8px; }
.rec-empty p { color: var(--ink-soft); font-size: 13.5px; margin: 0 0 4px; }

/* ---------- 食物库 ---------- */
.food-head { display: flex; gap: 8px; margin: 6px 0 10px; }
.food-search {
  flex: 1; border: 1px solid var(--line); background: var(--card);
  border-radius: 999px; padding: 11px 18px; font-size: 14px; color: var(--ink); outline: none;
}
.food-search:focus { border-color: var(--orange); }
.add-btn {
  border: none; background: var(--orange); color: #fff; font-size: 14px; font-weight: 700;
  padding: 0 18px; border-radius: 999px; cursor: pointer;
  box-shadow: 0 4px 12px rgba(239,138,60,.3); white-space: nowrap;
}
.food-list { display: flex; flex-direction: column; gap: 10px; }
.food-item {
  background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
  box-shadow: var(--shadow-sm); padding: 11px; display: flex; gap: 12px; align-items: center; cursor: pointer;
  animation: rise .4s cubic-bezier(.22,.9,.3,1.2) both;
}
.food-item .rec-img { width: 62px; height: 62px; font-size: 24px; }
.food-item-info { flex: 1; min-width: 0; }
.food-item-name { font-weight: 700; font-size: 14.5px; margin-bottom: 3px; }
.food-item-src { font-size: 11.5px; color: var(--ink-faint); margin-bottom: 6px; }

/* ---------- chips（标签） ---------- */
.chip-row { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  font-size: 12px; padding: 5px 12px; border-radius: 999px;
  background: var(--card); border: 1px solid var(--line); color: var(--ink-soft);
  cursor: pointer; font-weight: 600; transition: all .18s ease;
}
.chip.is-on { background: var(--orange-soft); border-color: #F0C08A; color: var(--orange-deep); }

/* ---------- 常见菜品速查 ---------- */
.preset-list { display: flex; flex-direction: column; gap: 6px; margin: -6px 0 12px; max-height: 220px; overflow-y: auto; }
.preset-item {
  display: flex; justify-content: space-between; align-items: center;
  border: 1px solid var(--line); background: var(--bg-soft);
  border-radius: var(--radius-sm); padding: 10px 12px; cursor: pointer;
  font-size: 13.5px; width: 100%; text-align: left;
}
.preset-item:active { background: var(--orange-soft); }
.preset-name { font-weight: 700; color: var(--ink); }
.preset-meta { font-size: 11.5px; color: var(--ink-soft); }
.preset-empty { font-size: 12.5px; color: var(--ink-faint); padding: 6px 2px; }

/* ---------- 空状态 ---------- */
.empty { text-align: center; padding: 40px 14px; }
.empty-emoji { font-size: 52px; margin-bottom: 10px; }
.empty-title { font-family: var(--font-display); font-size: 18px; font-weight: 700; margin: 0 0 8px; }
.empty-sub { font-size: 13px; color: var(--ink-soft); line-height: 1.7; margin: 0 0 18px; }

/* ---------- 按钮 ---------- */
.primary-btn {
  border: none; background: var(--orange); color: #fff; font-size: 14px; font-weight: 700;
  padding: 13px 24px; border-radius: 999px; cursor: pointer; width: 100%;
  box-shadow: 0 6px 16px rgba(239,138,60,.3);
  transition: transform .15s ease, background .2s ease;
}
.primary-btn:active { transform: scale(.97); background: var(--orange-deep); }
.ghost-btn {
  border: 1px solid var(--line); background: var(--card); color: var(--ink-soft);
  font-size: 13.5px; font-weight: 600; padding: 12px 20px; border-radius: 999px; cursor: pointer;
}
.ghost-btn.danger { color: var(--red); border-color: #F3CFC7; }

/* ---------- 表单 ---------- */
.form-card { margin-bottom: 14px; }
.field-row { display: flex; gap: 10px; margin-bottom: 12px; }
.field-row.three { gap: 8px; }
.field { flex: 1; display: flex; flex-direction: column; gap: 6px; margin-bottom: 12px; }
.field > span { font-size: 12px; color: var(--ink-soft); font-weight: 600; }
.field input, .field select {
  border: 1px solid var(--line); background: var(--bg-soft);
  border-radius: var(--radius-sm); padding: 11px 12px; font-size: 15px;
  color: var(--ink); outline: none; width: 100%; font-family: var(--font-body);
}
.field input:focus, .field select:focus { border-color: var(--orange); background: #fff; }

.veggie-toggle {
  display: flex; align-items: center; gap: 9px;
  margin: 2px 0 14px; font-size: 14px; color: var(--ink); cursor: pointer; user-select: none;
}
.veggie-toggle input { display: none; }
.veggie-toggle .check {
  width: 22px; height: 22px; border-radius: 8px;
  border: 2px solid var(--line); background: var(--bg-soft);
  display: grid; place-items: center; transition: all .2s ease;
}
.veggie-toggle .check::after {
  content: "✓"; color: #fff; font-size: 13px; font-weight: 700;
  opacity: 0; transform: scale(.5); transition: all .2s ease;
}
.veggie-toggle input:checked + .check { background: var(--green); border-color: var(--green); }
.veggie-toggle input:checked + .check::after { opacity: 1; transform: scale(1); }

.photo-box {
  border: 2px dashed var(--line); border-radius: var(--radius-sm); height: 120px;
  display: grid; place-items: center; cursor: pointer; overflow: hidden; background: var(--bg-soft);
  transition: border-color .2s ease;
}
.photo-box:hover { border-color: var(--orange); }
.photo-placeholder { font-size: 14px; color: var(--ink-faint); }
.photo-box img { width: 100%; height: 100%; object-fit: cover; }

.calc-result { display: flex; gap: 8px; margin: 6px 0 14px; }
.calc-item {
  flex: 1; background: var(--bg-soft); border-radius: var(--radius-sm);
  padding: 11px 8px; text-align: center; border: 1px solid var(--line);
}
.calc-item span { display: block; font-size: 11px; color: var(--ink-soft); margin-bottom: 5px; }
.calc-item b { font-size: 16px; font-family: var(--font-display); }
.calc-item.hot { background: var(--orange-soft); border-color: #F4CBA2; }
.calc-item.hot b { color: var(--orange-deep); }

.footnote { text-align: center; font-size: 11.5px; color: var(--ink-faint); padding: 6px 10px 20px; }

/* ---------- 底部导航 ---------- */
.tabbar {
  position: fixed; left: 50%; transform: translateX(-50%);
  bottom: calc(12px + env(safe-area-inset-bottom));
  width: calc(100% - 36px); max-width: 444px;
  background: rgba(255, 254, 251, .92);
  backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  border: 1px solid var(--line); border-radius: 999px;
  box-shadow: 0 10px 30px rgba(180,130,70,.18);
  display: flex; padding: 7px; z-index: 20;
}
.tab-item {
  flex: 1; border: none; background: transparent; color: var(--ink-faint);
  font-size: 12px; font-weight: 600;
  display: flex; flex-direction: column; align-items: center; gap: 2px;
  padding: 8px 0; border-radius: 999px; cursor: pointer; transition: all .25s ease;
}
.tab-item span { font-size: 11px; }
.tab-item.is-active { background: var(--orange); color: #fff; box-shadow: 0 4px 12px rgba(239,138,60,.3); }

/* ---------- 弹窗 ---------- */
.modal-mask {
  position: fixed; inset: 0; background: rgba(70,56,42,.4);
  backdrop-filter: blur(3px); display: grid; place-items: center;
  padding: 20px; z-index: 50; animation: fade .25s ease both;
}
.modal-mask[hidden] { display: none; }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }

.modal {
  background: var(--card); border-radius: 24px; padding: 20px;
  width: 100%; max-width: 420px; max-height: 86vh; overflow-y: auto;
  box-shadow: 0 20px 50px rgba(70,56,42,.3);
  animation: pop .35s cubic-bezier(.22,.9,.3,1.2) both;
}
@keyframes pop { from { opacity: 0; transform: scale(.92) translateY(10px); } to { opacity: 1; transform: scale(1) translateY(0); } }
.modal-title { font-family: var(--font-display); font-size: 20px; margin: 0 0 16px; }
.modal .field-row { margin-bottom: 0; }
.modal-actions { display: flex; gap: 8px; margin-top: 8px; }
.modal-actions .primary-btn { flex: 1.6; }
.modal-actions .ghost-btn { flex: 1; }

/* 点评弹窗 */
.review-body { display: flex; flex-direction: column; gap: 9px; margin-bottom: 12px; }
.review-line { font-size: 14px; line-height: 1.6; }
.review-tips {
  background: var(--orange-soft); border-radius: var(--radius-sm);
  padding: 12px; font-size: 13px; color: var(--orange-deep); margin-bottom: 14px; line-height: 1.6;
}

/* ---------- Toast ---------- */
.toast {
  position: fixed; left: 50%; bottom: calc(96px + env(safe-area-inset-bottom));
  transform: translateX(-50%);
  background: var(--ink); color: #fff; font-size: 13.5px;
  padding: 11px 22px; border-radius: 999px; box-shadow: 0 8px 24px rgba(70,56,42,.3);
  z-index: 100; animation: toast .3s cubic-bezier(.22,.9,.3,1.2) both; white-space: nowrap;
}
.toast[hidden] { display: none; }
@keyframes toast { from { opacity: 0; transform: translate(-50%, 10px); } to { opacity: 1; transform: translate(-50%, 0); } }

/* ---------- 桌面适配 ---------- */
@media (min-width: 600px) {
  .app { max-width: 560px; }
  .topbar { padding-top: 32px; }
  .greet-title { font-size: 34px; }
}
</style>
</head>
<body>
  <div class="grain" aria-hidden="true"></div>

  <div class="app">
    <header class="topbar">
      <div class="greet">
        <h1 class="greet-title">好好吃饭</h1>
        <p class="greet-sub" id="greet-sub">今天也要吃得开心呀 🍽️</p>
      </div>
      <div class="mascot" aria-hidden="true">🍚</div>
    </header>

    <main class="main">
      <!-- ============ 推荐页 ============ -->
      <section class="panel is-active" id="tab-recommend" role="tabpanel">
        <div class="overview card" id="overview">
          <div class="date-nav">
            <button id="date-prev" aria-label="前一天">‹</button>
            <span class="date-label" id="date-label">今天</span>
            <button id="date-next" aria-label="后一天">›</button>
          </div>
          <div class="ov-body">
            <div class="ov-ring-wrap">
              <svg class="ov-ring" viewBox="0 0 120 120">
                <circle class="ring-bg" cx="60" cy="60" r="52" />
                <circle class="ring-fg" id="ov-ring-fg" cx="60" cy="60" r="52" />
              </svg>
              <div class="ov-ring-center">
                <span class="ov-remaining-num" id="ov-remaining">—</span>
                <span class="ov-remaining-label" id="ov-remaining-label">还可吃 kcal</span>
              </div>
            </div>
            <div class="ov-stats">
              <div class="ov-line"><span>今日目标</span><b id="ov-target">— kcal</b></div>
              <div class="ov-line"><span>已摄入</span><b id="ov-eaten">0 kcal</b></div>
              <div class="ov-line"><span>蛋白质</span><b id="ov-protein">0 g</b></div>
              <div class="ov-line"><span>已花费</span><b id="ov-spent">¥0</b></div>
              <div class="ov-hint" id="ov-hint" hidden>⚠ 部分食物没填蛋白质</div>
            </div>
          </div>
        </div>

        <div class="day-log card" id="day-log" hidden>
          <h3 class="day-log-title">🍽️ 当天吃了啥</h3>
          <div id="day-log-list"></div>
        </div>

        <div class="meal-tabs" id="meal-tabs" role="tablist">

  <script>
'use strict';

/* ============================== 常量 ============================== */

const MEALS = {
  breakfast: { label: '早餐', ratio: 0.25, icon: '🌅', budgetKey: 'breakfastBudget', color: '#E8A33D' },
  lunch:     { label: '午餐', ratio: 0.40, icon: '☀️', budgetKey: 'lunchBudget', color: '#EF8A3C' },

  snack:     { label: '加餐', ratio: 0, icon: '🍪', budgetKey: 'snackBudget', color: '#D97C7C' },
};

const PRESET_TAGS = ['清淡', '高蛋白', '辣', '素菜', '油炸', '含糖', '汤类', '主食', '肉类', '鱼虾', '蛋奶'];

const COMMON_FOODS = [
  { name: '黄焖鸡米饭', kcal: 620, protein: 28, fat: 25, carb: 60, veggie: true },
  { name: '番茄鸡蛋面', kcal: 480, protein: 18, fat: 15, carb: 65, veggie: true },
  { name: '鸡胸肉沙拉', kcal: 350, protein: 32, fat: 12, carb: 20, veggie: true },
  { name: '牛肉拉面', kcal: 520, protein: 22, fat: 18, carb: 65, veggie: false },
  { name: '宫保鸡丁盖饭', kcal: 640, protein: 26, fat: 28, carb: 70, veggie: true },
  { name: '鱼香肉丝盖饭', kcal: 680, protein: 20, fat: 30, carb: 80, veggie: true },
  { name: '红烧肉', kcal: 550, protein: 18, fat: 45, carb: 10, veggie: false },
  { name: '麻婆豆腐', kcal: 260, protein: 14, fat: 20, carb: 8, veggie: false },
  { name: '番茄炒蛋', kcal: 200, protein: 12, fat: 14, carb: 8, veggie: true },
  { name: '清炒时蔬', kcal: 80, protein: 3, fat: 5, carb: 8, veggie: true },
  { name: '蒜蓉西兰花', kcal: 90, protein: 4, fat: 5, carb: 10, veggie: true },
  { name: '水煮蛋', kcal: 78, protein: 6, fat: 5, carb: 1, veggie: false },
  { name: '蛋炒饭', kcal: 550, protein: 15, fat: 20, carb: 75, veggie: false },
  { name: '牛肉汉堡', kcal: 720, protein: 30, fat: 35, carb: 60, veggie: false },
  { name: '烤鸡腿', kcal: 300, protein: 28, fat: 20, carb: 0, veggie: false },
  { name: '白米饭', kcal: 232, protein: 4, fat: 0, carb: 52, veggie: false },
  { name: '馒头', kcal: 223, protein: 7, fat: 1, carb: 47, veggie: false },
  { name: '肉包子', kcal: 250, protein: 10, fat: 10, carb: 30, veggie: false },
  { name: '白粥', kcal: 100, protein: 2, fat: 0, carb: 22, veggie: false },
  { name: '豆浆', kcal: 90, protein: 6, fat: 3, carb: 9, veggie: false },
  { name: '煎饼果子', kcal: 400, protein: 14, fat: 18, carb: 45, veggie: true },
  { name: '关东煮', kcal: 150, protein: 8, fat: 8, carb: 12, veggie: true },
];

const ACTIVITY_FACTOR = {
  sedentary: { none: 1.2, light: 1.375, moderate: 1.55, high: 1.725 },
  active:    { none: 1.375, light: 1.55, moderate: 1.725, high: 1.9 },
  manual:    { none: 1.55, light: 1.725, moderate: 1.9, high: 2.0 },
};

const DEFAULT_PROFILE = {
  gender: 'male', age: 20, height: 175, weight: 65,
  lifestyle: 'sedentary', exercise: 'none',
  goalMode: 'lose', loseKg: 5, loseDays: 30,
};
const DEFAULT_SETTINGS = { breakfastBudget: 10, lunchBudget: 18, dinnerBudget: 15, snackBudget: 10 };

const DB_NAME = 'haohao-chifan';
const DB_VERSION = 1;
const PROTEIN_PER_KG = 1.8;
const KCAL_PER_JIN = 3850;
const MAX_DAILY_DEFICIT = 1000;
const SNACK_TARGET = 200;
const RING_LEN = 326.7;

/* ============================== IndexedDB ============================== */

let db = null;

function openDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = (e) => {
      const d = e.target.result;
      if (!d.objectStoreNames.contains('foods')) {
        const s = d.createObjectStore('foods', { keyPath: 'id' });
        s.createIndex('mealType', 'mealType', { unique: false });
      }
      if (!d.objectStoreNames.contains('meta')) {
        d.createObjectStore('meta', { keyPath: 'key' });
      }
      if (!d.objectStoreNames.contains('history')) {
        const h = d.createObjectStore('history', { keyPath: 'id' });
        h.createIndex('date', 'date', { unique: false });
      }
    };
    req.onsuccess = () => { db = req.result; resolve(db); };
    req.onerror = () => reject(req.error);
  });
}

function tx(store, mode, fn) {
  return new Promise((resolve, reject) => {
    const t = db.transaction(store, mode);
    const os = t.objectStore(store);
    const req = fn(os);
    t.oncomplete = () => resolve(req ? req.result : undefined);
    t.onerror = () => reject(t.error);
  });
}

const getAllFoods = () => tx('foods', 'readonly', (os) => os.getAll());
const putFood = (food) => tx('foods', 'readwrite', (os) => os.put(food));
const deleteFood = (id) => tx('foods', 'readwrite', (os) => os.delete(id));
const getMeta = (key) => tx('meta', 'readonly', (os) => os.get(key));
const setMeta = (key, value) => tx('meta', 'readwrite', (os) => os.put({ key, value }));
const getAllHistory = () => tx('history', 'readonly', (os) => os.getAll());
const putHistory = (h) => tx('history', 'readwrite', (os) => os.put(h));
const deleteHistory = (id) => tx('history', 'readwrite', (os) => os.delete(id));

/* ============================== 工具 ============================== */

const $ = (id) => document.getElementById(id);
const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

function dateKey(d) {
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
}
function todayKey() { return dateKey(new Date()); }

function dateLabel(key) {
  const today = todayKey();
  const d = new Date(key + 'T00:00:00');
  const diff = Math.round((new Date(today + 'T00:00:00') - d) / 86400000);
  if (diff === 0) return '今天';
  if (diff === 1) return '昨天';
  if (diff === 2) return '前天';
  return `${d.getMonth() + 1}月${d.getDate()}日`;
}

function shiftDate(key, days) {
  const d = new Date(key + 'T00:00:00');
  d.setDate(d.getDate() + days);
  return dateKey(d);
}

function uid() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
}

function shuffleArray(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

let toastTimer = null;
function showToast(msg) {
  const t = $('toast');
  t.textContent = msg;
  t.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.hidden = true; }, 2200);
}

async function compressImage(file, maxSize = 1024, quality = 0.82) {
  try {
    const bitmap = await createImageBitmap(file, { imageOrientation: 'from-image' });
    const scale = Math.min(1, maxSize / Math.max(bitmap.width, bitmap.height));
    const canvas = document.createElement('canvas');
    canvas.width = Math.max(1, Math.round(bitmap.width * scale));
    canvas.height = Math.max(1, Math.round(bitmap.height * scale));
    canvas.getContext('2d').drawImage(bitmap, 0, 0, canvas.width, canvas.height);
    bitmap.close();
    const blob = await new Promise((res) => canvas.toBlob(res, 'image/jpeg', quality));
    return blob || file;
  } catch (e) {
    return new Promise((resolve) => {
      const img = new Image();
      const url = URL.createObjectURL(file);
      img.onload = () => {
        const scale = Math.min(1, maxSize / Math.max(img.width, img.height));
        const canvas = document.createElement('canvas');
        canvas.width = Math.max(1, Math.round(img.width * scale));
        canvas.height = Math.max(1, Math.round(img.height * scale));
        canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
        URL.revokeObjectURL(url);
        canvas.toBlob((blob) => resolve(blob || file), 'image/jpeg', quality);
      };
      img.onerror = () => { URL.revokeObjectURL(url); resolve(file); };
      img.src = url;
    });
  }
}

/* ============================== 计算 ============================== */

function calcBMR(p) {
  return p.gender === 'male'
    ? 10 * p.weight + 6.25 * p.height - 5 * p.age + 5
    : 10 * p.weight + 6.25 * p.height - 5 * p.age - 161;
}

function activityFactor(p) {
  const ls = ACTIVITY_FACTOR[p.lifestyle] || ACTIVITY_FACTOR.sedentary;
  return ls[p.exercise] || 1.2;
}

function calcTDEE(p) {
  return calcBMR(p) * activityFactor(p);
}

function targetKcal(p) {
  const tdee = calcTDEE(p);
  const bmr = calcBMR(p);
  if (p.goalMode === 'maintain') return Math.round(tdee);
  const loseKg = parseFloat(p.loseKg) || 0;
  const loseDays = parseInt(p.loseDays, 10) || 1;
  const deficit = Math.min((loseKg * KCAL_PER_JIN) / loseDays, MAX_DAILY_DEFICIT);
  return Math.round(Math.max(tdee - deficit, bmr * 0.9));
}

function dailyProtein(p) {
  return Math.round(p.weight * PROTEIN_PER_KG);
}

function todayEatenKcal() {
  const today = todayKey();
  return state.history.filter((h) => h.date === today).reduce((s, h) => s + h.kcal, 0);
}

function mealTarget(mealKey) {
  const p = state.profile;
  if (mealKey === 'snack') {
    const remaining = Math.max(0, targetKcal(p) - todayEatenKcal());
    const kcal = Math.min(SNACK_TARGET, remaining);
    return { kcal, protein: 10, budget: state.settings.snackBudget ?? 10, remaining };
  }
  const kcal = Math.round(targetKcal(p) * MEALS[mealKey].ratio);
  const protein = Math.round(dailyProtein(p) * MEALS[mealKey].ratio);
  const budget = state.settings[MEALS[mealKey].budgetKey] ?? 20;
  return { kcal, protein, budget, remaining: 0 };
}

/* ============================== 状态 ============================== */

const state = {
  profile: { ...DEFAULT_PROFILE },
  profileSet: false,
  settings: { ...DEFAULT_SETTINGS },
  foods: [],
  history: [],
  currentMeal: 'breakfast',
  currentDate: todayKey(),
  currentResults: [],
  editingId: null,
  pendingImage: null,
  editingFood: null,
  tagSelection: new Set(),
  tagFilter: new Set(),
  mealSelection: new Set(),
  lastEntryId: null,
};

/* ============================== 数据规范化 ============================== */

function normalizeFood(f) {
  const nf = { ...f };
  if (!Array.isArray(nf.mealTypes)) {
    nf.mealTypes = nf.mealType === 'breakfast' ? ['breakfast']
      : nf.mealType === 'lunch' ? ['lunch']
      : nf.mealType === 'dinner' ? ['dinner'] : [];
  }
  delete nf.mealType;
  if (!Array.isArray(nf.tags)) nf.tags = [];
  return nf;
}

function normalizeProfile(p) {
  const np = { ...DEFAULT_PROFILE, ...p };
  if (p && !p.lifestyle && p.activity) {
    const map = {
      sedentary: ['sedentary', 'none'],
      light: ['sedentary', 'light'],
      moderate: ['sedentary', 'moderate'],
      high: ['sedentary', 'high'],
    };
    const [ls, ex] = map[p.activity] || ['sedentary', 'none'];
    np.lifestyle = ls;
    np.exercise = ex;
  }
  return np;
}

/* ============================== 推荐算法 ============================== */

function recentFoodIds(meal, days = 3) {
  const set = new Set();
  const now = new Date();
  for (const h of state.history) {
    if (h.meal !== meal) continue;
    const diff = (now - new Date(h.date)) / 86400000;
    if (diff >= 0 && diff < days) h.foodIds.forEach((id) => set.add(id));
  }
  return set;
}

function recentTags(meal, days = 3) {
  const set = new Set();
  const now = new Date();
  for (const h of state.history) {
    if (h.meal !== meal) continue;
    const diff = (now - new Date(h.date)) / 86400000;
    if (diff >= 0 && diff < days) (h.tags || []).forEach((t) => set.add(t));
  }
  return set;
}

function scoreResult(r, target) {
  const kcalScore = clamp(100 - Math.abs(r.kcal - target.kcal) / Math.max(target.kcal, 1) * 100, 0, 100);
  const proteinScore = r.missingProtein ? 0 : clamp(r.protein / Math.max(target.protein, 1) * 100, 0, 100);
  const veggieScore = r.veggie ? 100 : 0;
  const priceScore = clamp(100 - r.price / Math.max(target.budget, 1) * 50, 0, 100);
  let diversityScore = 100;
  if (r.recentHit) diversityScore = 20;
  else if (r.tagHit) diversityScore = 55;
  return kcalScore * 0.4 + proteinScore * 0.22 + veggieScore * 0.15 + diversityScore * 0.15 + priceScore * 0.08;
}

function buildResults(meal) {
  const target = mealTarget(meal);
  const recentIds = recentFoodIds(meal);
  const recentT = recentTags(meal);
  const candidates = state.foods.filter(
    (f) => (f.mealTypes.length === 0 || f.mealTypes.includes(meal)) && f.price <= target.budget,
  );

  const make = (foods) => {
    const kcal = foods.reduce((s, f) => s + (f.kcal || 0), 0);
    const protein = foods.reduce((s, f) => s + (f.protein ?? 0), 0);
    const missingProtein = foods.some((f) => f.protein == null);
    const fat = foods.reduce((s, f) => s + (f.fat ?? 0), 0);
    const carb = foods.reduce((s, f) => s + (f.carb ?? 0), 0);
    const price = foods.reduce((s, f) => s + f.price, 0);
    const veggie = foods.some((f) => f.veggie);
    const tags = [...new Set(foods.flatMap((f) => f.tags || []))];
    const recentHit = foods.some((f) => recentIds.has(f.id));
    const tagHit = !recentHit && tags.some((t) => recentT.has(t));
    return { type: foods.length === 1 ? 'single' : 'combo', foods, kcal, protein, missingProtein, fat, carb, price, veggie, tags, recentHit, tagHit };
  };

  const results = [];

  for (const f of candidates) {
    const r = make([f]);
    r.score = scoreResult(r, target);
    results.push(r);
  }

  for (let i = 0; i < candidates.length; i++) {
    for (let j = i + 1; j < candidates.length; j++) {
      const r = make([candidates[i], candidates[j]]);
      if (r.price > target.budget) continue;
      r.score = scoreResult(r, target);
      results.push(r);
    }
  }

  return results.sort((a, b) => b.score - a.score);
}

/* ============================== 营养点评 ============================== */

function reviewMeal(r) {
  const t = mealTarget(state.currentMeal);
  const lines = [];
  const tips = [];

  if (state.currentMeal === 'snack') {
    if (r.kcal <= 150) lines.push(`🍪 加餐 ${r.kcal} kcal，量挺合适`);
    else if (r.kcal <= 300) lines.push(`🍪 加餐 ${r.kcal} kcal，稍微有点多`);
    else lines.push(`🍪 加餐 ${r.kcal} kcal，这已经算正餐的量啦`);
    if (r.kcal > t.remaining && t.remaining > 0) {
      tips.push(`今天本来只剩 ${t.remaining} kcal 了，这一口有点超标`);
    }
  } else {
    const ratio = r.kcal / Math.max(t.kcal, 1);
    if (ratio < 0.8) {
      lines.push(`🔥 热量 ${r.kcal} kcal（本餐目标 ${t.kcal} kcal），偏低`);
      tips.push('可以再加点主食或蛋白质垫垫');
    } else if (ratio <= 1.1) {
      lines.push(`🔥 热量 ${r.kcal} kcal，合适 ✅`);
    } else {
      lines.push(`🔥 热量 ${r.kcal} kcal（本餐目标 ${t.kcal} kcal），偏高`);
      tips.push('注意别吃太撑，下一餐可以少点');
    }

    if (r.missingProtein) {
      lines.push('🥚 蛋白质没填，补填后点评更准确');
    } else {
      const pr = r.protein / Math.max(t.protein, 1);
      if (pr < 0.8) {
        lines.push(`🥚 蛋白质 ${r.protein}g（目标 ${t.protein}g），偏少`);
        tips.push('加个蛋、鸡腿或牛奶补蛋白');
      } else {
        lines.push(`🥚 蛋白质 ${r.protein}g，充足 ✅`);
      }
    }

    if (r.veggie) lines.push('🥬 有蔬菜 ✅');
    else {
      lines.push('🥬 这餐没蔬菜');
      tips.push('下餐记得吃点青菜');
    }
  }

  return { lines, tips };
}

/* ============================== 渲染 ============================== */

function renderOverview() {
  const eaten = state.history.filter((h) => h.date === state.currentDate);
  const kcal = eaten.reduce((s, h) => s + h.kcal, 0);
  const protein = eaten.reduce((s, h) => s + h.protein, 0);
  const price = eaten.reduce((s, h) => s + h.price, 0);
  const missingProtein = eaten.some((h) => h.missingProtein);
  const target = targetKcal(state.profile);
  const remaining = Math.max(0, target - kcal);
  const isToday = state.currentDate === todayKey();

  $('ov-target').textContent = `${target} kcal`;
  $('ov-eaten').textContent = `${kcal} kcal`;
  $('ov-protein').textContent = missingProtein ? `${protein}+ g` : `${protein} g`;
  $('ov-spent').textContent = `¥${price.toFixed(1)}`;
  $('ov-hint').hidden = !missingProtein;

  const ratio = clamp(kcal / target, 0, 1);
  $('ov-remaining').textContent = remaining;
  $('ov-ring-fg').style.strokeDashoffset = RING_LEN * (1 - ratio);
  $('ov-remaining-label').textContent = isToday ? '还可吃 kcal' : '当时剩余 kcal';

  $('date-label').textContent = dateLabel(state.currentDate);
  $('date-next').disabled = isToday;

  $('greet-sub').textContent = state.profileSet
    ? '今天也要吃得开心呀 🍽️'
    : '先在「我的」完善身材，推荐才准确哦 👇';
}

function renderDayLog() {
  const wrap = $('day-log');
  const list = $('day-log-list');
  const records = state.history.filter((h) => h.date === state.currentDate);

  if (records.length === 0) {
    wrap.hidden = true;
    return;
  }

  wrap.hidden = false;
  const order = ['breakfast', 'lunch', 'dinner', 'snack'];
  const groups = order
    .map((m) => ({ meal: m, items: records.filter((h) => h.meal === m) }))
    .filter((g) => g.items.length > 0);

  list.innerHTML = groups.map((g) => {
    const m = MEALS[g.meal];
    const items = g.items.map((h) => `
      <div class="log-item">
        <span class="log-dot" style="background:${m.color}"></span>
        <span class="log-names">${esc(h.names.join(' + '))}</span>
        <span class="log-meta">${h.kcal} kcal · ¥${h.price.toFixed(1)}</span>
        <button class="log-del" data-id="${h.id}" aria-label="删除">×</button>
      </div>`).join('');
    return `<div class="log-group"><div class="log-meal">${m.icon} ${m.label}</div>${items}</div>`;
  }).join('');
}

function renderMealTarget() {
  const el = $('meal-target');
  if (!state.profileSet) {
    el.innerHTML = '📝 先在「我的」里填好身高体重，我才能算出你该吃多少';
    return;
  }
  const t = mealTarget(state.currentMeal);
  if (state.currentMeal === 'snack') {
    el.innerHTML = `🍪 <b>加餐</b>：今天还可吃 <b>${t.remaining}</b> kcal · 建议加餐 ≤ <b>${t.kcal}</b> kcal · 💰 ≤ <b>¥${t.budget}</b>`;
    return;
  }
  const m = MEALS[state.currentMeal];
  el.innerHTML = `${m.icon} <b>${m.label}</b> 目标：🔥 <b>${t.kcal}</b> kcal · 🥚 <b>${t.protein}</b> g · 💰 ≤ <b>¥${t.budget}</b>`;
}

function recCardHTML(r, idx) {
  const img = r.foods[0].image;
  const imgHTML = img
    ? `<img src="${URL.createObjectURL(img)}" alt="">`
    : (r.type === 'combo' ? '🍱' : '🍽️');

  const title = r.type === 'combo'
    ? r.foods.map((f) => esc(f.name)).join(' + ')
    : esc(r.foods[0].name);

  const tags = [`<span class="tag kcal">🔥 ${r.kcal} kcal</span>`];
  if (r.missingProtein) tags.push(`<span class="tag protein missing">🥚 蛋白未填</span>`);
  else tags.push(`<span class="tag protein">🥚 ${r.protein}g</span>`);

  if (r.type === 'single') {
    const f = r.foods[0];
    if (f.fat != null) tags.push(`<span class="tag fat">🧈 ${f.fat}g</span>`);
    if (f.carb != null) tags.push(`<span class="tag carb">🍚 ${f.carb}g</span>`);
  }

  if (r.veggie) tags.push(`<span class="tag veg">🥬 蔬菜</span>`);
  tags.push(`<span class="tag price">¥${r.price.toFixed(1)}</span>`);
  if (r.type === 'combo') tags.push(`<span class="tag badge">搭配</span>`);

  const tagChips = (r.tags || []).slice(0, 2).map((t) => `<span class="tag chip">${esc(t)}</span>`).join('');
  const pct = Math.round(r.score);

  return `
    <article class="rec-card">
      <div class="rec-img">${imgHTML}</div>
      <div class="rec-body">
        <div class="rec-title ${r.type === 'combo' ? 'combo-title' : ''}">${title}</div>
        <div class="rec-tags">${tags.join('')}${tagChips}</div>
        <div class="rec-score">匹配 <span class="bar"><i style="width:${pct}%"></i></span> ${pct}%</div>
      </div>
      <button class="eat-btn" data-eat="${idx}">就吃这个</button>
    </article>`;
}

function renderRecommend(shuffle = false) {
  const list = $('rec-list');
  const results = buildResults(state.currentMeal);

  if (results.length === 0) {
    const m = MEALS[state.currentMeal];
    const extra = state.currentMeal === 'snack' ? '今天的热量已经用完啦，明天再吃吧' : '去「食物库」录入食堂的菜，或者调高预算上限吧';
    list.innerHTML = `
      <div class="rec-empty">
        <div class="empty-emoji">🫙</div>
        <p>${m.label}还没有可选的食物</p>
        <p>${extra}</p>
      </div>`;
    $('reshuffle').hidden = true;
    state.currentResults = [];
    return;
  }

  let shown;
  if (shuffle) {
    const pool = results.slice(0, Math.min(12, results.length));
    shown = shuffleArray([...pool]).slice(0, Math.min(6, pool.length));
  } else {
    shown = results.slice(0, 6);
  }

  state.currentResults = shown;
  list.innerHTML = shown.map((r, i) => recCardHTML(r, i)).join('');
  $('reshuffle').hidden = results.length <= 6;
}

function renderFoods() {
  const list = $('food-list');
  const empty = $('food-empty');
  const q = $('food-search').value.trim().toLowerCase();
  const activeTags = [...state.tagFilter];

  const items = state.foods.filter((f) => {
    const matchQ = !q || f.name.toLowerCase().includes(q) || (f.source || '').toLowerCase().includes(q);
    const matchTags = activeTags.every((t) => (f.tags || []).includes(t));
    return matchQ && matchTags;
  });

  empty.hidden = true;

  if (items.length === 0) {
    list.innerHTML = state.foods.length === 0
      ? ''
      : `<div class="rec-empty"><div class="empty-emoji">🔍</div><p>没有找到符合条件的食物</p></div>`;
    if (state.foods.length === 0) empty.hidden = false;
    return;
  }

  list.innerHTML = items.map((f) => {
    const img = f.image ? `<img src="${URL.createObjectURL(f.image)}" alt="">` : '🍽️';
    const tags = [
      `<span class="tag kcal">🔥 ${f.kcal}</span>`,
      `<span class="tag price">¥${f.price.toFixed(1)}</span>`,
    ];
    if (f.protein != null) tags.push(`<span class="tag protein">🥚 ${f.protein}g</span>`);
    if (f.fat != null) tags.push(`<span class="tag fat">🧈 ${f.fat}g</span>`);
    if (f.carb != null) tags.push(`<span class="tag carb">🍚 ${f.carb}g</span>`);
    if (f.veggie) tags.push(`<span class="tag veg">🥬</span>`);
    const tagChips = (f.tags || []).slice(0, 3).map((t) => `<span class="tag chip">${esc(t)}</span>`).join('');
    const more = (f.tags || []).length > 3 ? `<span class="tag chip">+${f.tags.length - 3}</span>` : '';

    return `
      <div class="food-item" data-id="${f.id}">
        <div class="rec-img">${img}</div>
        <div class="food-item-info">
          <div class="food-item-name">${esc(f.name)}</div>
          <div class="food-item-src">${esc(f.source || '') || '—'}</div>
          <div class="rec-tags">${tags.join('')}${tagChips}${more}</div>
        </div>
      </div>`;
  }).join('');
}

function renderTagSelect() {
  const box = $('f-tags');
  const all = [...new Set([...PRESET_TAGS, ...state.tagSelection])];
  box.innerHTML = all.map((t) =>
    `<button type="button" class="chip ${state.tagSelection.has(t) ? 'is-on' : ''}" data-tag="${esc(t)}">${esc(t)}</button>`
  ).join('');
}

function renderMealSelect() {
  const box = $('f-meals');
  const opts = [['breakfast', '🌅 早餐'], ['lunch', '☀️ 午餐'], ['dinner', '🌙 晚餐'], ['snack', '🍪 加餐']];
  box.innerHTML = opts.map(([k, label]) =>
    `<button type="button" class="chip ${state.mealSelection.has(k) ? 'is-on' : ''}" data-meal="${k}">${label}</button>`
  ).join('');
}

function renderFoodTagFilter() {
  const box = $('food-tag-filter');
  const all = [...new Set([...PRESET_TAGS, ...state.foods.flatMap((f) => f.tags || [])])];
  if (all.length === 0) { box.innerHTML = ''; return; }
  box.innerHTML = all.map((t) =>
    `<button type="button" class="chip ${state.tagFilter.has(t) ? 'is-on' : ''}" data-tag="${esc(t)}">${esc(t)}</button>`
  ).join('');
}

function renderPresetList() {
  const list = $('f-preset-list');
  const q = $('f-preset-search').value.trim();
  if (!q) { list.innerHTML = ''; return; }
  const matches = COMMON_FOODS.filter((f) => f.name.includes(q)).slice(0, 8);
  if (matches.length === 0) {
    list.innerHTML = `<div class="preset-empty">没找到，换个关键词试试（比如「鸡」「面」「米饭」）</div>`;
    return;
  }
  list.innerHTML = matches.map((f) => `
    <button type="button" class="preset-item" data-name="${esc(f.name)}">
      <span class="preset-name">${esc(f.name)}</span>
      <span class="preset-meta">🔥${f.kcal} kcal · 🥚${f.protein}g</span>
    </button>`).join('');
}

}

const parseOptNum = (v) => {
  const n = parseFloat(v);
  return isNaN(n) || n < 0 ? null : Math.round(n * 10) / 10;
};

function openFoodModal(food) {
  state.editingFood = food || null;
  state.editingId = food ? food.id : null;
  state.pendingImage = null;
  state.tagSelection = new Set(food ? (food.tags || []) : []);
  state.mealSelection = new Set(food ? (food.mealTypes || []) : []);

  $('food-modal-title').textContent = food ? '编辑食物' : '添加食物';
  $('food-delete').hidden = !food;

  $('f-name').value = food ? food.name : '';
  $('f-source').value = food ? (food.source || '') : '';
  $('f-price').value = food ? food.price : '';
  $('f-kcal').value = food ? food.kcal : '';
  $('f-protein').value = food && food.protein != null ? food.protein : '';
  $('f-fat').value = food && food.fat != null ? food.fat : '';
  $('f-carb').value = food && food.carb != null ? food.carb : '';
  $('f-veggie').checked = food ? !!food.veggie : false;
  $('f-tag-custom').value = '';
  $('f-preset-search').value = '';
  $('f-preset-list').innerHTML = '';

  if (food && food.image) {
    $('f-image-preview').src = URL.createObjectURL(food.image);
    $('f-image-preview').hidden = false;
    $('f-image-placeholder').hidden = true;
  } else {
    $('f-image-preview').removeAttribute('src');
    $('f-image-preview').hidden = true;
    $('f-image-placeholder').hidden = false;
  }

  renderTagSelect();
  renderMealSelect();
  $('food-modal').hidden = false;
}

function closeFoodModal() {
  $('food-modal').hidden = true;
  state.editingId = null;
  state.editingFood = null;
  state.pendingImage = null;
  state.tagSelection = new Set();
  state.mealSelection = new Set();
}

async function saveFood(e) {
  e.preventDefault();
  const name = $('f-name').value.trim();
  const price = parseFloat($('f-price').value);
  const kcal = parseInt($('f-kcal').value, 10);

  if (!name) { showToast('填一下菜名吧'); return; }
  if (isNaN(price) || price < 0) { showToast('价格要填哦'); return; }
  if (isNaN(kcal) || kcal < 0) { showToast('热量要填哦（可从上面速查表点选）'); return; }

  const image = state.pendingImage !== null
    ? state.pendingImage
    : (state.editingFood ? state.editingFood.image : null);

  const food = {
    id: state.editingId || uid(),
    name,
    source: $('f-source').value.trim(),
    price: Math.round(price * 10) / 10,
    kcal,
    protein: parseOptNum($('f-protein').value),
    fat: parseOptNum($('f-fat').value),
    carb: parseOptNum($('f-carb').value),
    mealTypes: [...state.mealSelection],
    veggie: $('f-veggie').checked,
    tags: [...state.tagSelection],
    image,
    createdAt: state.editingFood ? state.editingFood.createdAt : Date.now(),
  };

  await putFood(food);
  await loadFoods();
  closeFoodModal();
  renderFoods();
  renderFoodTagFilter();
  renderRecommend();
  renderOverview();
  showToast(state.editingId ? '已保存修改' : '已加入食物库 🎉');
}

async function removeFood() {
  if (!state.editingId) return;
  if (!confirm('确定删除这个食物吗？')) return;
  await deleteFood(state.editingId);
  await loadFoods();
  closeFoodModal();
  renderFoods();
  renderFoodTagFilter();
  renderRecommend();
  renderOverview();
  showToast('已删除');
}

async function loadFoods() {
  const foods = await getAllFoods();
  state.foods = foods.map(normalizeFood).sort((a, b) => b.createdAt - a.createdAt);
}

async function loadMeta() {
  const [p, s] = await Promise.all([getMeta('profile'), getMeta('settings')]);
  if (p) { state.profile = normalizeProfile(p.value); state.profileSet = true; }
  if (s) state.settings = { ...DEFAULT_SETTINGS, ...s.value };
}

async function loadHistory() {
  state.history = await getAllHistory();
}

/* ============================== 事件 ============================== */

function bindEvents() {
  document.querySelectorAll('.tab-item').forEach((btn) => {
    btn.addEventListener('click', () => switchTab(btn.dataset.tab));
  });

  $('date-prev').addEventListener('click', () => {
    state.currentDate = shiftDate(state.currentDate, -1);
    renderOverview();
    renderDayLog();
  });
  $('date-next').addEventListener('click', () => {
    const next = shiftDate(state.currentDate, 1);
    if (next > todayKey()) return;
    state.currentDate = next;
    renderOverview();
    renderDayLog();
  });

  document.querySelectorAll('.meal-tab').forEach((btn) => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.meal-tab').forEach((b) => b.classList.remove('is-active'));
      btn.classList.add('is-active');
      state.currentMeal = btn.dataset.meal;
      renderMealTarget();
      renderRecommend();
    });
  });

  $('reshuffle').addEventListener('click', () => renderRecommend(true));

  $('rec-list').addEventListener('click', (e) => {
    const btn = e.target.closest('.eat-btn');
    if (!btn) return;
    const r = state.currentResults[parseInt(btn.dataset.eat, 10)];
    if (!r) return;
    eatThis(r);
  });

  // 当天明细：删除某条记录
  $('day-log-list').addEventListener('click', async (e) => {
    const btn = e.target.closest('.log-del');
    if (!btn) return;
    const id = btn.dataset.id;
    await deleteHistory(id);
    state.history = state.history.filter((h) => h.id !== id);
    renderOverview();
    renderDayLog();
    renderRecommend();
    showToast('已删除这条记录');
  });

  // 点评弹窗
  $('review-close').addEventListener('click', closeReview);
  $('review-undo').addEventListener('click', undoLastEat);

  $('food-search').addEventListener('input', renderFoods);

  $('food-tag-filter').addEventListener('click', (e) => {
    const chip = e.target.closest('.chip');
    if (!chip) return;
    const t = chip.dataset.tag;
    if (state.tagFilter.has(t)) state.tagFilter.delete(t);
    else state.tagFilter.add(t);
    renderFoodTagFilter();
    renderFoods();
  });

  $('food-add-btn').addEventListener('click', () => openFoodModal(null));
  $('food-empty-add').addEventListener('click', () => openFoodModal(null));

  $('food-list').addEventListener('click', (e) => {
    const item = e.target.closest('.food-item');
    if (!item) return;
    const food = state.foods.find((f) => f.id === item.dataset.id);
    if (food) openFoodModal(food);
  });

  $('food-cancel').addEventListener('click', closeFoodModal);
  $('food-delete').addEventListener('click', removeFood);
  $('food-form').addEventListener('submit', saveFood);

  $('f-preset-search').addEventListener('input', renderPresetList);
  $('f-preset-list').addEventListener('click', (e) => {
    const item = e.target.closest('.preset-item');
    if (!item) return;
    const f = COMMON_FOODS.find((x) => x.name === item.dataset.name);
    if (!f) return;
    $('f-name').value = f.name;
    $('f-kcal').value = f.kcal;
    $('f-protein').value = f.protein ?? '';
    $('f-fat').value = f.fat ?? '';
    $('f-carb').value = f.carb ?? '';
    $('f-veggie').checked = !!f.veggie;
    $('f-preset-list').innerHTML = '';
    $('f-preset-search').value = '';
    showToast(`已填入「${f.name}」的营养数据`);
  });

  $('f-meals').addEventListener('click', (e) => {
    const chip = e.target.closest('.chip');
    if (!chip) return;
    const k = chip.dataset.meal;
    if (state.mealSelection.has(k)) state.mealSelection.delete(k);
    else state.mealSelection.add(k);
    renderMealSelect();
  });

  $('f-tags').addEventListener('click', (e) => {
    const chip = e.target.closest('.chip');
    if (!chip) return;
    const t = chip.dataset.tag;
    if (state.tagSelection.has(t)) state.tagSelection.delete(t);
    else state.tagSelection.add(t);
    renderTagSelect();
  });

  $('f-tag-custom').addEventListener('keydown', (e) => {
    if (e.key !== 'Enter') return;
    e.preventDefault();
    const v = $('f-tag-custom').value.trim();
    if (!v) return;
    state.tagSelection.add(v);
    $('f-tag-custom').value = '';
    renderTagSelect();
  });

  $('f-image-box').addEventListener('click', () => $('f-image').click());
  $('f-image').addEventListener('change', async (e) => {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    const blob = await compressImage(file);
    state.pendingImage = blob;
    $('f-image-preview').src = URL.createObjectURL(blob);
    $('f-image-preview').hidden = false;
    $('f-image-placeholder').hidden = true;
  });

  ['pf-gender', 'pf-age', 'pf-height', 'pf-weight', 'pf-lifestyle', 'pf-exercise', 'pf-goal', 'pf-lose-kg', 'pf-lose-days'].forEach((id) => {
    $(id).addEventListener('input', updateCalcPreview);
    $(id).addEventListener('change', updateCalcPreview);
  });
  $('pf-goal').addEventListener('change', () => {
    $('pf-goal-lose').hidden = $('pf-goal').value === 'maintain';
  });

  $('pf-save').addEventListener('click', async () => {
    const p = readProfileForm();
    if (!p.height || !p.weight || !p.age) { showToast('身高体重年龄要填完整哦'); return; }
    state.profile = p;
    state.profileSet = true;
    await setMeta('profile', p);
    renderOverview();
    renderMealTarget();
    renderRecommend();
    showToast('身材档案已保存 ✅');
  });

  $('budget-save').addEventListener('click', async () => {
    const read = (id, fallback) => {
      const v = parseFloat($(id).value);
      return isNaN(v) || v < 0 ? fallback : v;
    };
    state.settings = {
      breakfastBudget: read('budget-breakfast', 10),
      lunchBudget: read('budget-lunch', 18),
      dinnerBudget: read('budget-dinner', 15),
      snackBudget: read('budget-snack', 10),
    };
    await setMeta('settings', state.settings);
    renderMealTarget();
    renderRecommend();
    showToast('预算已保存 ✅');
  });
}

function switchTab(name) {
  document.querySelectorAll('.panel').forEach((p) => p.classList.remove('is-active'));
  document.querySelectorAll('.tab-item').forEach((b) => b.classList.remove('is-active'));
  $('tab-' + name).classList.add('is-active');
  document.querySelector(`.tab-item[data-tab="${name}"]`).classList.add('is-active');
}

async function eatThis(r) {
  const entry = {
    id: uid(),
    date: todayKey(),
    meal: state.currentMeal,
    foodIds: r.foods.map((f) => f.id),
    names: r.foods.map((f) => f.name),
    tags: r.tags,
    kcal: r.kcal,
    protein: r.protein,
    missingProtein: r.missingProtein,
    price: r.price,
  };
  await putHistory(entry);
  state.history.push(entry);
  state.lastEntryId = entry.id;
  state.currentDate = todayKey();
  renderOverview();
  renderDayLog();
  renderRecommend();
  openReview(r);
}

function openReview(r) {
  const { lines, tips } = reviewMeal(r);
  $('review-body').innerHTML = lines.map((l) => `<div class="review-line">${l}</div>`).join('');
  $('review-tips').hidden = tips.length === 0;
  $('review-tips').innerHTML = tips.length ? `💡 建议：${tips.join('；')}` : '';
  $('review-modal').hidden = false;
}

function closeReview() {
  $('review-modal').hidden = true;
  state.lastEntryId = null;
}

async function undoLastEat() {
  if (!state.lastEntryId) return;
  const id = state.lastEntryId;
  await deleteHistory(id);
  state.history = state.history.filter((h) => h.id !== id);
  state.lastEntryId = null;
  renderOverview();
  renderDayLog();
  renderRecommend();
  closeReview();
  showToast('已撤销 ✅');
}

/* ============================== 初始化 ============================== */

async function init() {
  await openDB();
  await Promise.all([loadMeta(), loadFoods(), loadHistory()]);

  fillProfileForm();
  fillSettingsForm();
  renderOverview();
  renderDayLog();
  renderMealTarget();
  renderRecommend();
  renderFoods();
  renderFoodTagFilter();
  bindEvents();
}

init();
</script>
</body>
</html>
